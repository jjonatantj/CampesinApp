# Configuración de SonarQube para CampesinApp
sonar.projectKey=CampesinApp
sonar.projectName=CampesinApp
sonar.projectVersion=1.0

# Codificación de archivos
sonar.sourceEncoding=UTF-8

# Ruta del reporte de cobertura generado por coverlet (formato OpenCover)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Exclusiones de cobertura (pruebas, migraciones, librerías frontend y archivos generados)
sonar.coverage.exclusions=CampesinApp.Tests/**,**/Migrations/**,wwwroot/**,Program.cs

